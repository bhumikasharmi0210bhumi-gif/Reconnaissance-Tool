# ==============================================================================
# ReconX - Safe NSE Configuration (config/safe-nse.conf)
# ==============================================================================
# POLICY STATEMENT:
# This configuration only defines SAFE discovery, enumeration, version detection,
# and metadata-gathering NSE scripts.
# 
# STRICTLY FORBIDDEN IN THIS CONFIGURATION:
# - Brute-force credentials scripts (e.g. *-brute)
# - Denial of Service scripts (e.g. dos, broadcast-*)
# - Exploitation scripts (e.g. exploit/*)
# - Malware / backdoors / intrusive payloads
# ==============================================================================

# General Safe Enumeration Suite
[GENERAL_SAFE]
scripts=default,safe

# Web Application Reconnaissance (Safe enumeration of titles, headers, allowed methods)
[HTTP_SAFE]
ports=80,443,8000,8008,8080,8443,8888
scripts=http-title,http-headers,http-methods,http-enum,http-robots.txt

# SSL / TLS Encryption & Certificate Audit
[SSL_SAFE]
ports=443,465,636,8443,993,995
scripts=ssl-cert,ssl-enum-ciphers,ssl-date

# DNS Server Safe Fingerprinting
[DNS_SAFE]
ports=53
scripts=dns-nsid,dns-service-discovery

# SSH Server Configuration Inspection
[SSH_SAFE]
ports=22,2222
scripts=ssh-hostkey,ssh2-enum-algos

# SMB / Windows Safe OS & Security Mode Discovery
[SMB_SAFE]
ports=139,445
scripts=smb-os-discovery,smb-security-mode,smb2-security-mode,smb2-capabilities

# SMTP Mail Server Safe Capabilities Inspection
[SMTP_SAFE]
ports=25,465,587
scripts=smtp-commands
